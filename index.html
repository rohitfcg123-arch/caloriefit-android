function addFoodModal(food,meal){var body='<form id="addFoodForm"><input type="hidden" name="foodId" value="'+esc(food.id||'')+'"><input type="hidden" name="name" value="'+esc(food.name)+'"><div class="meal" style="padding-top:0"><div class="food-emoji">'+foodEmoji(food)+'</div><div class="meal-info"><strong>'+esc(food.name)+'</strong><span>Per serving: '+num(food.kcal)+' kcal</span></div></div><div class="form-row"><div class="field"><label>Servings / quantity</label><input name="qty" type="number" min=".1" max="100" step=".1" value="1" required></div><div class="field"><label>Meal</label><select name="meal">'+['Breakfast','Lunch','Dinner','Snacks'].map(function(m){return '<option '+(m===(meal||preferredMeal||'Lunch')?'selected':'')+'>'+m+'</option>'}).join('')+'</select></div></div><div class="small muted" id="servingPreview" style="margin:0 0 12px">Nutrition totals will update after adding.</div><button class="btn btn-primary" style="width:100%">Add to log</button></form>';openModal('Log food',body);var form=document.getElementById('addFoodForm');form.qty.addEventListener('input',function(){document.getElementById('servingPreview').textContent='Approx. '+num(food.kcal*Number(form.qty.value))+' kcal · Protein '+num(food.p*Number(form.qty.value),1)+' g · Carbs '+num(food.c*Number(form.qty.value),1)+' g · Fat '+num(food.f*Number(form.qty.value),1)+' g'});form.addEventListener('submit',function(e){e.preventDefault();var q=Number(form.qty.value);if(!q||q<=0)return;addEntry({name:food.name,emoji:food.emoji,meal:form.meal.value,qty:q,kcal:food.kcal*q,p:food.p*q,c:food.c*q,f:food.f*q,foodId:food.id,base:food.base});closeModal();toast('Food added to your log');render()})}
function addEntry(entry){var l=dayLog(selectedDate);l.meals.push(Object.assign({id:id(),createdAt:new Date().toISOString()},entry));save()}
function customFoodModal(){openModal('Create custom food','<form id="customFoodForm"><div class="field"><label>Food name</label><input name="name" required placeholder="e.g. Homemade mixed sabzi"></div><div class="form-row"><div class="field"><label>Calories / serving</label><input name="kcal" type="number" min="0" required></div><div class="field"><label>Serving label</label><input name="base" value="1 serving" required></div></div><div class="form-row"><div class="field"><label>Protein (g)</label><input name="p" type="number" min="0" step=".1" value="0"></div><div class="field"><label>Carbs (g)</label><input name="c" type="number" min="0" step=".1" value="0"></div><div class="field"><label>Fat (g)</label><input name="f" type="number" min="0" step=".1" value="0"></div></div><div class="field"><label>Meal to log</label><select name="meal"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snacks</option></select></div><button class="btn btn-primary" style="width:100%">Save & add to log</button></form>');document.getElementById('customFoodForm').addEventListener('submit',function(e){e.preventDefault();var f=e.target,food={id:id(),name:f.elements.namedItem('name').value.trim(),base:f.base.value,kcal:Number(f.kcal.value),p:Number(f.p.value||0),c:Number(f.c.value||0),f:Number(f.f.value||0),emoji:'🍽️',category:'Other'};state.customFoods.push(food);FOODS.push(food);addEntry({name:food.name,emoji:food.emoji,meal:f.meal.value,qty:1,kcal:food.kcal,p:food.p,c:food.c,f:food.f,foodId:food.id,base:food.base});closeModal();toast('Custom food saved for this session and logged');render()})}
function addWeightModal(){openModal('Log weight','<form id="weightForm"><div class="field"><label>Date</label><input name="date" type="date" value="'+selectedDate+'" required></div><div class="field"><label>Weight (kg)</label><input name="weight" type="number" min="25" max="350" step=".1" value="'+state.profile.weight+'" required></div><button class="btn btn-primary" style="width:100%">Save weigh-in</button></form>');document.getElementById('weightForm').addEventListener('submit',function(e){e.preventDefault();var f=e.target,d=f.date.value,w=Number(f.weight.value);state.weighIns=state.weighIns.filter(function(x){return x.date!==d});state.weighIns.push({date:d,weight:w});if(d>=today())state.profile.weight=w;save();closeModal();toast('Weight saved');render()})}
function download(filename,data,type){var blob=new Blob([data],{type:type||'application/octet-stream'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000)}
function exportJSON(){download('caloriefit-backup-'+today()+'.json',JSON.stringify({version:1,exportedAt:new Date().toISOString(),state:state,customFoods:state.customFoods||[]},null,2),'application/json');toast('JSON backup downloaded')}
function exportCSV(){var rows=[['Date','Food','Meal','Quantity','Calories kcal','Protein g','Carbs g','Fat g','Steps','Water glasses','Exercise minutes']];Object.keys(state.logs).sort().forEach(function(d){var l=state.logs[d];if(!l.meals.length)rows.push([d,'','','',0,0,0,0,l.steps||0,l.water||0,l.exercise||0]);l.meals.forEach(function(m){rows.push([d,m.name,m.meal,m.qty,m.kcal,m.p,m.c,m.f,l.steps||0,l.water||0,l.exercise||0])})});var csv=rows.map(function(r){return r.map(function(v){var s=String(v==null?'':v);return '"'+s.replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');download('caloriefit-food-log-'+today()+'.csv',csv,'text/csv;charset=utf-8');toast('CSV downloaded')}
function savePlan(){var p=state.profile;function val(id,old){var e=document.getElementById(id);return e?Number(e.value):old}p.goal=document.getElementById('planGoal').value;p.goalWeight=val('planGoalWeight',p.goalWeight);p.weight=val('planWeight',p.weight);p.height=val('planHeight',p.height);p.activity=document.getElementById('planActivity').value;p.calorieTarget=val('planCalories',p.calorieTarget);p.proteinTarget=val('planProtein',p.proteinTarget);p.carbTarget=val('planCarbs',p.carbTarget);p.fatTarget=val('planFat',p.fatTarget);p.goal=p.goal==='loss'?'loss':p.goal; p.startWeight=p.startWeight||p.weight;state.weighIns=state.weighIns.filter(function(w){return w.date!==today()});state.weighIns.push({date:today(),weight:p.weight});save();toast('Your plan was saved');render()}
function suggestedCalories(){var p=state.profile,activity={sedentary:1.2,light:1.375,moderate:1.55,high:1.725}[document.getElementById('planActivity').value]||1.375;var bmi=p.weight/Math.pow(p.height/100,2);var base=10*p.weight+6.25*p.height-5*(p.age||26)-78;var maintain=Math.round(base*activity/50)*50;var goal=document.getElementById('planGoal').value;var target=goal==='loss'?maintain-350:goal==='gain'?maintain+250:maintain;target=Math.max(1200,Math.min(4000,target));document.getElementById('planCalories').value=target;toast('Suggested target filled in — review before saving')}
function bindPage(){var sd=document.getElementById('selectedDate');if(sd)sd.addEventListener('change',function(){selectedDate=sd.value||today();render()});
var fs=document.getElementById('foodSearch');if(fs){fs.addEventListener('input',function(){foodQuery=fs.value;var res=document.getElementById('foodResults');if(res)res.innerHTML=foodSearchList()})}
var qf=document.getElementById('quickAddForm');if(qf)qf.addEventListener('submit',function(e){e.preventDefault();var f=qf;addEntry({name:f.elements.namedItem('name').value,emoji:'🍽️',meal:f.meal.value,qty:Number(f.qty.value),kcal:Number(f.kcal.value)*Number(f.qty.value),p:Number(f.p.value||0)*Number(f.qty.value),c:Number(f.c.value||0)*Number(f.qty.value),f:Number(f.f.value||0)*Number(f.qty.value)});toast('Food added');render()});
var pf=document.getElementById('profileForm');if(pf)pf.addEventListener('submit',function(e){e.preventDefault();var f=e.target;['name','age','height','weight','goalWeight'].forEach(function(k){state.profile[k]=k==='name'?f[k].value.trim():Number(f[k].value)});save();toast('Profile saved');render()});
var tf=document.getElementById('targetsForm');if(tf)tf.addEventListener('submit',function(e){e.preventDefault();var f=e.target;['calorieTarget','proteinTarget','carbTarget','fatTarget'].forEach(function(k){state.profile[k]=Number(f[k].value)});save();toast('Targets saved');render()});
var pref=document.getElementById('preferencesForm');if(pref)pref.addEventListener('submit',function(e){e.preventDefault();state.settings.waterTarget=Number(pref.waterTarget.value);state.settings.stepTarget=Number(pref.stepTarget.value);save();toast('Preferences saved');render()});
}
document.addEventListener('click',function(e){
var page=e.target.closest('[data-page]');if(page){var next=page.getAttribute('data-page');if(next==='more'&&currentPage==='more')return;setPage(next);return}
var shift=e.target.closest('[data-shift]');if(shift){selectedDate=dateShift(selectedDate,Number(shift.getAttribute('data-shift')));render();return}
var add=e.target.closest('[data-add-food]');if(add){var food=getFood(add.getAttribute('data-add-food'));if(food)addFoodModal(food,preferredMeal);return}
var del=e.target.closest('[data-delete-meal]');if(del){var i=Number(del.getAttribute('data-delete-meal'));if(confirm('Remove this food entry?')){dayLog(selectedDate).meals.splice(i,1);save();toast('Entry removed');render()}return}
var cat=e.target.closest('[data-food-category]');if(cat){foodCategory=cat.getAttribute('data-food-category');render();return}
var planT=e.target.closest('[data-plan-tab]');if(planT){planTab=planT.getAttribute('data-plan-tab');render();return}
var progT=e.target.closest('[data-progress-tab]');if(progT){progressTab=progT.getAttribute('data-progress-tab');render();return}
var reportT=e.target.closest('[data-report-range]');if(reportT){reportRange=reportT.getAttribute('data-report-range');render();return}
var setT=e.target.closest('[data-settings-tab]');if(setT){settingsTab=setT.getAttribute('data-settings-tab');render();return}
var mealAdd=e.target.closest('[data-meal-add]');if(mealAdd){preferredMeal=mealAdd.getAttribute('data-meal-add')||'Lunch';currentPage='addfood';render();return}
var water=e.target.closest('[data-water]');if(water){var log=dayLog(selectedDate);log.water=Math.min(99,(log.water||0)+1);save();toast('Water logged');render();return}
var syncSteps=e.target.closest('[data-sync-steps]');if(syncSteps){if(window.CalorieFitNative&&window.CalorieFitNative.syncTodaySteps){window.CalorieFitNative.syncTodaySteps();toast('Requesting steps from Health Connect…')}else{toast('Automatic steps require the CalorieFit Android app.')}return}
var startWalk=e.target.closest('[data-start-walk]');if(startWalk){if(window.CalorieFitNative&&window.CalorieFitNative.startWalking){window.CalorieFitNative.startWalking();toast('Requesting walking permissions…')}else{toast('GPS walking tracker requires the CalorieFit Android app.')}return}
var stopWalk=e.target.closest('[data-stop-walk]');if(stopWalk){if(window.CalorieFitNative&&window.CalorieFitNative.stopWalking){window.CalorieFitNative.stopWalking();toast('Stopping walking session…')}return}
var edit=e.target.closest('[data-edit-stat]');if(edit){var key=edit.getAttribute('data-edit-stat'),label=key==='steps'?'Step count':'Exercise minutes',value=dayLog(selectedDate)[key]||0,ans=prompt('Enter '+label+' for '+fmtDate(selectedDate),value);if(ans!==null&&ans.trim()!==''&&Number(ans)>=0){dayLog(selectedDate)[key]=Number(ans);save();render()}return}
var act=e.target.closest('[data-action]');if(act){var action=act.getAttribute('data-action');if(action==='custom-food'){customFoodModal()}else if(action==='save-plan'){savePlan()}else if(action==='suggest-calories'){suggestedCalories()}else if(action==='add-weight'){addWeightModal()}else if(action==='export-json'){exportJSON()}else if(action==='export-csv'){exportCSV()}else if(action==='import-json'){var inp=document.getElementById('importFile');if(inp)inp.click()}else if(action==='reset-data'){if(confirm('This deletes all CalorieFit data saved in this browser. Export a backup first. Continue?')){localStorage.removeItem(KEY);state=initState();FOODS=FOODS.filter(function(f){return BUILTIN_FOOD_IDS.includes(f.id)});save();toast('Local data reset');setPage('dashboard')}}return}
var wt=e.target.closest('[data-delete-weight]');if(wt){var d=wt.getAttribute('data-delete-weight');if(confirm('Delete weigh-in for '+d+'?')){state.weighIns=state.weighIns.filter(function(x){return x.date!==d});save();render()}return}
var rec=e.target.closest('[data-recipe]');if(rec){var r=RECIPES[Number(rec.getAttribute('data-recipe'))];addEntry({name:r.name,emoji:r.emoji,meal:'Lunch',qty:1,kcal:r.kcal,p:r.p||0,c:r.c||0,f:r.f||0});toast('Recipe logged. Edit macros if you know the exact ingredients.');render();return}
var art=e.target.closest('[data-article]');if(art){var a=ARTICLES[Number(art.getAttribute('data-article'))];openModal(a.title,'<div style="font-size:44px;margin-bottom:12px">'+a.emoji+'</div><p style="line-height:1.75;color:#69776f">'+a.desc+'</p><p style="line-height:1.75;color:#69776f">Start with small, repeatable steps. Use food labels when possible, pay attention to portion size, and judge trends over several weeks. Nutrition needs differ by person, so seek qualified advice for medical or condition-specific plans.</p>');return}
});
document.addEventListener('click',async function(e){var google=e.target.closest('[data-auth-google]');if(google){if(!authConfigured()){toast('Firebase config missing');return}if(!authInstance||!authApi){toast('Firebase is initializing; try again shortly');return}try{var provider=new authApi.GoogleAuthProvider();await authApi.signInWithPopup(authInstance,provider);toast('Logged in with Google')}catch(err){toast(err&&err.code?err.code.replace('auth/','').replace(/-/g,' '):'Google login failed')}return}var at=e.target.closest('[data-auth-tab]');if(at){authTab=at.getAttribute('data-auth-tab');render();return}var reset=e.target.closest('[data-action="reset-password"]');if(reset){var email=prompt('Enter your account email for a password reset');if(email&&authInstance&&authApi)authApi.sendPasswordResetEmail(authInstance,email).then(function(){toast('Password reset email sent')}).catch(function(err){toast(err.code||'Password reset failed')});else if(email)toast('Firebase config is required');return}});
document.addEventListener('submit',async function(e){if(e.target&&e.target.id==='authForm'){e.preventDefault();var f=e.target;if(!authConfigured()){toast('Firebase web config is required before sign-in can work');return}if(!authInstance||!authApi){toast('Firebase is initializing; try again shortly');return}var email=f.elements.namedItem('email').value.trim(),password=f.elements.namedItem('password').value;try{if(authTab==='signup')await authApi.createUserWithEmailAndPassword(authInstance,email,password);else await authApi.signInWithEmailAndPassword(authInstance,email,password);toast(authTab==='signup'?'Account created':'Logged in')}catch(err){toast(err&&err.code?err.code.replace('auth/','').replace(/-/g,' '):'Authentication failed')}}});
document.getElementById('closeModal').addEventListener('click',closeModal);
document.getElementById('modalBackdrop').addEventListener('click',function(e){if(e.target===this)closeModal()});
document.getElementById('topExport').addEventListener('click',exportJSON);
document.getElementById('topNotice').addEventListener('click',function(){toast('Your tracker is ready. Remember to log meals and water.')});
document.addEventListener('change',function(e){if(e.target&&e.target.id==='importFile'){var file=e.target.files&&e.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(){try{var obj=JSON.parse(reader.result),next=obj.state||obj;if(!next.profile||!next.logs)throw new Error('Invalid backup');if(confirm('Import backup and replace the current local data?')){state=next;if(!Array.isArray(state.customFoods))state.customFoods=[];FOODS=FOODS.filter(function(f){return BUILTIN_FOOD_IDS.includes(f.id)});FOODS.push.apply(FOODS,state.customFoods);save();toast('Backup imported');render()}}catch(err){toast('Invalid or unsupported backup file')}e.target.value=''};reader.readAsText(file)}});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});
window.calorieFitReceiveSteps=function(steps){var d=today();dayLog(d).steps=Math.max(0,Number(steps)||0);save();if(selectedDate===d)render();toast('Health Connect synced: '+num(dayLog(d).steps)+' steps')};window.calorieFitStepsError=function(message){toast(String(message||'Health Connect step sync failed'))};
window.calorieFitWalkStatus=function(raw){try{var w=typeof raw==='string'?JSON.parse(raw):raw;var status=document.getElementById('walkSessionStatus'),stats=document.getElementById('walkSessionStats');if(status)status.textContent=w.active?'Tracking in background · GPS '+(w.route&&w.route.length?'active':'waiting for GPS'):'Not tracking';if(stats){var mins=w.startMs?Math.max(0,Math.floor((Date.now()-w.startMs)/60000)):0;stats.textContent=num(w.steps||0)+' session steps · '+((Number(w.distanceM||0)/1000).toFixed(2))+' km · '+mins+' min · '+((w.route&&w.route.length)||0)+' GPS points';}var start=document.querySelector('[data-start-walk]'),stop=document.querySelector('[data-stop-walk]');if(start)start.disabled=!!w.active;if(stop)stop.disabled=!w.active;}catch(e){console.warn('Walking status parse failed',e)}};
window.calorieFitWalkError=function(message){toast(String(message||'Walking tracker could not start'))};
function refreshWalkStatus(){if(window.CalorieFitNative&&window.CalorieFitNative.getWalkingStatus)window.CalorieFitNative.getWalkingStatus()}
setInterval(refreshWalkStatus,5000);
render();
initFirebaseAuth();
})();
</script>
</body>
